<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="splashBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#5E121E" />
      <stop offset="60%" stop-color="#4A0E17" />
      <stop offset="100%" stop-color="#200408" />
    </radialGradient>
    <linearGradient id="goldSplash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#A68322" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#splashBg)" />

  <!-- Center Crest -->
  <g transform="translate(415, 680) scale(1.0)">
    <circle cx="125" cy="125" r="140" fill="#380B12" stroke="url(#goldSplash)" stroke-width="4" />
    <circle cx="125" cy="125" r="154" fill="none" stroke="url(#goldSplash)" stroke-width="2" stroke-dasharray="10 8" stroke-opacity="0.6" />
    
    <g transform="translate(0, 10) scale(1.0)" fill="url(#goldSplash)">
      <path d="M 125 35 L 150 95 L 215 55 L 185 145 L 65 145 L 35 55 L 100 95 Z" />
      <circle cx="125" cy="22" r="14" />
      <circle cx="35" cy="45" r="11" />
      <circle cx="215" cy="45" r="11" />
      <rect x="65" y="150" width="120" height="20" rx="6" />
      <circle cx="85" cy="160" r="5" fill="#4A0E17" />
      <circle cx="125" cy="160" r="6" fill="#4A0E17" />
      <circle cx="165" cy="160" r="5" fill="#4A0E17" />
    </g>
  </g>

  <!-- Shilpa Dresses Titles -->
  <text x="540" y="1060" font-family="'Cinzel', serif, Georgia" font-size="64" font-weight="bold" fill="#FDFBF7" text-anchor="middle" letter-spacing="10">
    SHILPA DRESSES
  </text>
  <text x="540" y="1120" font-family="sans-serif" font-size="24" font-weight="600" fill="url(#goldSplash)" text-anchor="middle" letter-spacing="8">
    LUXURY BOUTIQUE &amp; VIP TRIAL STUDIO
  </text>

  <!-- Footer Developer Branding: NEXORA Technologies -->
  <g transform="translate(0, 1680)">
    <text x="540" y="0" font-family="sans-serif" font-size="18" fill="#FDFBF7" fill-opacity="0.6" text-anchor="middle" letter-spacing="4">
      DEVELOPED &amp; BRANDED BY
    </text>
    <text x="540" y="38" font-family="sans-serif" font-size="28" font-weight="bold" fill="url(#goldSplash)" text-anchor="middle" letter-spacing="6">
      NEXORA TECHNOLOGIES
    </text>
    <text x="540" y="74" font-family="sans-serif" font-size="18" font-style="italic" fill="#FDFBF7" fill-opacity="0.8" text-anchor="middle" letter-spacing="3">
      "Ideas to Impact"
    </text>
  </g>
</svg>
