<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5E121E" />
      <stop offset="70%" stop-color="#4A0E17" />
      <stop offset="100%" stop-color="#25060B" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997819" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6" />

  <!-- Outer Filigree Ring -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" />
  <circle cx="256" cy="230" r="152" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Shilpa Imperial Crown Emblem -->
  <g transform="translate(156, 130) scale(0.78)" fill="url(#goldGrad)" stroke="#25060B" stroke-width="2">
    <path d="M 128 30 L 150 90 L 220 50 L 190 140 L 66 140 L 36 50 L 106 90 Z" />
    <circle cx="128" cy="18" r="14" />
    <circle cx="36" cy="38" r="11" />
    <circle cx="220" cy="38" r="11" />
    <!-- Crown Base Jewels -->
    <rect x="66" y="145" width="124" height="20" rx="6" />
    <circle cx="86" cy="155" r="5" fill="#5E121E" />
    <circle cx="128" cy="155" r="6" fill="#5E121E" />
    <circle cx="170" cy="155" r="5" fill="#5E121E" />
  </g>

  <!-- Shilpa Dresses Typography -->
  <text x="256" y="388" font-family="'Cinzel', serif, Georgia" font-size="34" font-weight="bold" fill="#FDFBF7" text-anchor="middle" letter-spacing="4">
    SHILPA DRESSES
  </text>
  <text x="256" y="420" font-family="sans-serif" font-size="14" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="5">
    LUXURY COUTURE
  </text>

  <!-- NEXORA Branding -->
  <text x="256" y="468" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FDFBF7" fill-opacity="0.75" text-anchor="middle" letter-spacing="2">
    BY NEXORA TECHNOLOGIES
  </text>
</svg>
